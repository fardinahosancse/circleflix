<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b4bff"/>
      <stop offset=".55" stop-color="#9446ff"/>
      <stop offset="1" stop-color="#e04ad8"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".2" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#f1e6ff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2a0a6b" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="232" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="232" fill="url(#glow)"/>
  <rect x="33.5" y="33.5" width="957" height="957" rx="230.5" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="3"/>
  <g filter="url(#sh)">
    <!-- the "C": a thick ring opened on the right -->
    <path d="M736 316 A300 300 0 1 0 736 708" fill="none" stroke="url(#ring)" stroke-width="92" stroke-linecap="round"/>
    <!-- play glyph inside the C -->
    <path d="M452 386 Q452 352 482 369 L652 480 Q680 498 652 516 L482 627 Q452 644 452 610 Z" fill="#fff"/>
  </g>
</svg>
